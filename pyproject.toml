[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "desiccant-props"
description = "Thermophysical properties of aqueous liquid desiccants for HVAC simulation"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version", "license"]

[project.urls]
Repository = "https://github.com/NatLabRockies/DesiccantProps"
Documentation = "https://desiccantprops.readthedocs.io/"
"Rust API" = "https://docs.rs/desiccant-props"

[tool.maturin]
features = ["python", "pyo3/extension-module"]
python-source = "python"
module-name = "desiccant_props._native"
